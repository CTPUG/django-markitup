name: Django CI

on: [push, pull_request]

jobs:
  tox:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
        django-version: ['3.2', '4.0','4.1', '4.2', '5.0', '5.1']
        exclude:
          - django-version: '3.2'
            python-version: '3.11'
          - django-version: '3.2'
            python-version: '3.12'
          - django-version: '3.2'
            python-version: '3.13'
          - django-version: '4.0'
            python-version: '3.11'
          - django-version: '4.0'
            python-version: '3.12'
          - django-version: '4.0'
            python-version: '3.13'
          - django-version: '4.1'
            python-version: '3.12'
          - django-version: '4.1'
            python-version: '3.13'
          - django-version: '4.2'
            python-version: '3.13'
          - django-version: '5.0'
            python-version: '3.13'
          - django-version: '5.0'
            python-version: '3.8'
          - django-version: '5.0'
            python-version: '3.9'
          - django-version: '5.1'
            python-version: '3.8'
          - django-version: '5.1'
            python-version: '3.9'
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox
    - name: Run Tests with tox
      env:
        TOXENV: 'py${{ matrix.python-version }}-${{ matrix.django-version }}'
      run: |
        tox 
